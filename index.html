<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b3a55">
<title>Musgo &amp; Engrenagens</title>
<style>
:root{--paper:#fff4dc;--paper2:#ffe9bd;--ink:#5a3b2e;--line:#8a5a3c;--green:#7cc66a;--teal:#3fb8a8;--pink:#ff8fa8;--gold:#f2c14e;--red:#e8584a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#16202b;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Baloo 2","Varela Round","Segoe UI",system-ui,sans-serif;font-weight:700;color:var(--ink)}
#app{position:absolute;left:50%;top:0;transform:translateX(-50%);height:100%;width:100%;overflow:hidden;background:#3f8fc4}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
img.ic{image-rendering:pixelated;image-rendering:crisp-edges;display:block;pointer-events:none}
.hide{display:none!important}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 8px 0 8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
#hudL,#hudR{display:flex;flex-direction:column;gap:5px}
#hudR{align-items:flex-end}
.chip{background:rgba(255,244,220,.93);border:2px solid var(--line);border-radius:12px;padding:3px 8px;font-size:13px;display:flex;align-items:center;gap:5px;box-shadow:0 2px 0 rgba(90,59,46,.35);pointer-events:auto;white-space:nowrap}
#hearts{display:flex;gap:1px;flex-wrap:wrap;max-width:150px;background:rgba(40,30,50,.35);border-radius:10px;padding:3px 5px}
#hearts img{width:20px;height:20px}
#clock{font-variant-numeric:tabular-nums}
#hudBtns{display:flex;gap:5px}
.rbtn{width:36px;height:36px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;pointer-events:auto;box-shadow:0 2px 0 rgba(90,59,46,.35);color:var(--ink)}
.rbtn:active{transform:translateY(2px);box-shadow:none}
#quest{position:absolute;left:8px;right:8px;top:calc(84px + env(safe-area-inset-top));pointer-events:auto;z-index:4;display:flex;justify-content:center}
#questIn{max-width:94%;background:rgba(43,58,85,.82);color:#fff7e0;border-radius:12px;padding:5px 11px;font-size:12.5px;line-height:1.25;text-align:center;border:2px solid rgba(255,244,220,.5);text-shadow:0 1px 0 rgba(0,0,0,.4)}
#questIn b{color:#ffd86b}
#boss{position:absolute;left:14%;right:14%;top:calc(128px + env(safe-area-inset-top));height:16px;border-radius:9px;border:2px solid #fff4dc;background:#3a2b35;overflow:hidden;z-index:4}
#boss i{display:block;height:100%;background:linear-gradient(#ff8f7a,#d9483f);width:100%}
#boss span{position:absolute;left:0;right:0;top:-1px;text-align:center;font-size:10.5px;color:#fff;text-shadow:0 1px 0 #000}
#toasts{position:absolute;left:0;right:0;top:calc(150px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:6}
.toast{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:center;box-shadow:0 3px 0 rgba(90,59,46,.3);animation:tin .25s ease-out;max-width:88%}
.toast.out{transition:opacity .4s,transform .4s;opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
/* Controls */
#ctl{position:absolute;left:0;right:0;bottom:0;height:calc(150px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
#joy{position:absolute;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:radial-gradient(rgba(255,244,220,.28),rgba(255,244,220,.12));border:2px solid rgba(255,244,220,.55);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffdf2,#ffdf9e);border:2px solid var(--line);box-shadow:0 3px 0 rgba(90,59,46,.4)}
.abtn{position:absolute;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;box-shadow:0 4px 0 rgba(90,59,46,.5)}
.abtn:active,.abtn.down{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,59,46,.5)}
.abtn small{position:absolute;bottom:-3px;right:-3px;background:var(--ink);color:#fff;border-radius:8px;font-size:10px;padding:0 5px;line-height:15px}
#btnA{right:16px;bottom:calc(44px + env(safe-area-inset-bottom));width:80px;height:80px;background:radial-gradient(circle at 35% 30%,#d6ffc9,#7cc66a)}
#btnB{right:104px;bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;background:radial-gradient(circle at 35% 30%,#ffe1e6,#ff8fa8)}
#btnA img{width:44px;height:44px}#btnB img{width:34px;height:34px}
#hot{position:absolute;left:0;right:0;bottom:calc(152px + env(safe-area-inset-bottom));height:56px;display:flex;gap:6px;padding:0 8px;align-items:flex-end;pointer-events:none;z-index:5}
#hotScroll{flex:1;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;pointer-events:auto;scrollbar-width:none;touch-action:pan-x;padding:8px 2px 2px 2px;min-width:0}
#hotScroll::-webkit-scrollbar{display:none}
.slot{flex:0 0 46px;width:46px;height:46px;border-radius:11px;background:rgba(255,244,220,.94);border:2px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(90,59,46,.35);pointer-events:auto}
.slot img{width:32px;height:32px}
.slot.sel{border-color:#ff6b4a;background:#fff;transform:translateY(-6px);box-shadow:0 0 0 3px #ffd486,0 5px 0 rgba(90,59,46,.3)}
.slot .n,.cell .n{position:absolute;right:3px;bottom:0;font-size:11px;color:#fff;text-shadow:-1px 0 #5a3b2e,1px 0 #5a3b2e,0 -1px #5a3b2e,0 1px #5a3b2e,0 2px #5a3b2e}
.slot.tool{background:#ffd9c9}
#bagBtn{flex:0 0 50px;width:50px;height:50px;border-radius:14px;background:linear-gradient(#ffe9b8,#ffc96a);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 3px 0 #a86b3c;margin-bottom:2px}
#bagBtn img{width:34px;height:34px}
#bagBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #a86b3c}
#buildBar{position:absolute;left:0;right:0;bottom:calc(214px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;pointer-events:none;z-index:5}
#buildBar .btn{pointer-events:auto}
#buildInfo{background:rgba(43,58,85,.85);color:#fff7e0;border-radius:10px;padding:5px 10px;font-size:12px;display:flex;align-items:center;max-width:56%}
/* buttons */
.btn{background:linear-gradient(#fff0c9,#ffd486);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 #a86b3c;padding:7px 13px;font:inherit;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a86b3c}
.btn.g{background:linear-gradient(#d6ffc9,#8fd67c)}
.btn.r{background:linear-gradient(#ffd9d2,#ff9d8c)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:10px}
.btn[disabled]{filter:grayscale(.9);opacity:.55;pointer-events:none}
/* panel */
#shade{position:absolute;inset:0;background:rgba(30,25,45,.45);z-index:22}
#panel{position:absolute;left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom));max-height:78%;background:var(--paper);border:3px solid var(--line);border-radius:20px;box-shadow:0 6px 0 rgba(60,40,30,.45);z-index:23;display:flex;flex-direction:column;overflow:hidden;animation:pin .22s ease-out}
@keyframes pin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#pHead{display:flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(#ffdf9e,#ffd07a);border-bottom:3px solid var(--line);font-size:16px}
#pHead .x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff4dc;display:flex;align-items:center;justify-content:center;font-size:15px}
#pTabs{display:flex;gap:4px;padding:7px 8px 0 8px;background:var(--paper2);border-bottom:2px solid var(--line)}
.tab{flex:1;text-align:center;padding:6px 2px;border:2px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;background:#f3d9a4;font-size:12.5px;opacity:.75}
.tab.on{background:var(--paper);opacity:1;position:relative;top:2px}
#pBody{padding:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1;font-size:13.5px;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.cell{height:52px;border-radius:10px;background:#fffaf0;border:2px solid #d9b98a;position:relative;display:flex;align-items:center;justify-content:center}
.cell img{width:36px;height:36px}
.cell.on{border-color:#ff6b4a;background:#fff;box-shadow:0 0 0 2px #ffd486}
.cell.empty{opacity:.45;border-style:dashed}
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;background:#fffaf0;border:2px solid #e2c698;margin-bottom:6px}
.row .ico{flex:0 0 40px;height:40px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:9px;border:2px solid #e2c698;position:relative}
.row .ico img{width:32px;height:32px}
.row .mid{flex:1;min-width:0}
.row .mid .t{font-size:14px}
.row .mid .d{font-size:11.5px;opacity:.8;font-weight:600}
.cost{display:flex;flex-wrap:wrap;gap:3px 7px;margin-top:2px}
.cost span{display:inline-flex;align-items:center;gap:2px;font-size:11.5px}
.cost span img{width:16px;height:16px}
.cost span.no{color:var(--red)}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin:8px 2px 5px}
.bar{height:12px;border-radius:7px;background:#e8d2a6;border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#b7ef9c,#6cc25c)}
.bar.o i{background:linear-gradient(#ffd98a,#f29a3d)}
.slots{display:flex;gap:10px;justify-content:center;align-items:center;margin:8px 0}
.mslot{width:66px;text-align:center;font-size:11px}
.mslot .cell{height:58px;margin-bottom:3px}
.arrow{font-size:22px;opacity:.6}
.info{background:#fff;border:2px dashed #d9b98a;border-radius:12px;padding:8px 10px;margin:6px 0;font-weight:600;font-size:12.5px}
.info b{color:#c05a2c}
.kv{display:flex;justify-content:space-between;padding:3px 2px;border-bottom:1px dashed #e2c698}
/* dialog */
#dlg{position:absolute;left:8px;right:8px;bottom:calc(160px + env(safe-area-inset-bottom));background:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 rgba(60,40,30,.45);padding:10px 12px 12px 12px;z-index:24;display:flex;gap:10px;min-height:92px;animation:pin .2s ease-out}
#dlgPic{flex:0 0 64px;height:64px;border-radius:14px;background:linear-gradient(#cdefff,#fff0f5);border:2px solid var(--line);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
#dlgPic img{width:60px;height:auto;image-rendering:pixelated}
#dlgName{font-size:13px;color:#c05a2c;margin-bottom:2px}
#dlgText{font-size:14px;line-height:1.35;font-weight:600;min-height:54px}
#dlgNext{position:absolute;right:12px;bottom:5px;font-size:12px;opacity:.6;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
/* title */
#title{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(rgba(30,40,70,.15),rgba(30,40,70,.55));text-align:center;padding:20px}
#logo{font-size:44px;line-height:.95;color:#fff7e0;letter-spacing:.01em;text-shadow:0 2px 0 #8a5a3c,0 4px 0 #5a3b2e,0 7px 14px rgba(0,0,0,.45);transform:rotate(-3deg);margin-bottom:6px}
#logo span{display:block;font-size:26px;color:#ffd86b;transform:rotate(3deg)}
#logo em{font-style:normal;color:#b7ef9c}
#sub{color:#fff7e0;font-size:13px;text-shadow:0 1px 0 #000;max-width:300px;font-weight:600;margin-bottom:8px}
#title .btn{min-width:210px;font-size:17px;padding:11px 16px}
#ver{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));font-size:10.5px;color:#fff7e0;opacity:.75;font-weight:600}
#fade{position:absolute;inset:0;background:#141825;z-index:30;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1;pointer-events:auto}
#fadeTxt{position:absolute;left:0;right:0;top:45%;text-align:center;color:#fff7e0;font-size:18px}
.mapwrap{height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#mapc{width:232px;height:232px;image-rendering:pixelated;transform:scaleY(.5) rotate(45deg);border:2px solid var(--line);border-radius:4px}
.credits{text-align:center}
.credits h2{margin:4px 0;color:#c05a2c}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud" class="hide">
    <div id="hudL">
      <div id="hearts"></div>
      <div style="display:flex;gap:5px"><div class="chip" id="coinChip"><img class="ic" id="coinIc" width="18" height="18"><span id="coins">0</span></div>
      <div class="chip hide" id="pwChip">⚡ <span id="pw">0/0</span></div></div>
    </div>
    <div id="hudR">
      <div class="chip" id="clock">Dia 1 · 06:00</div>
      <div id="hudBtns">
        <div class="rbtn" id="zoomBtn">🔍</div>
        <div class="rbtn" id="menuBtn">☰</div>
      </div>
    </div>
  </div>
  <div id="quest" class="hide"><div id="questIn"></div></div>
  <div id="boss" class="hide"><i></i><span>Guardião de Musgo</span></div>
  <div id="toasts"></div>
  <div id="buildBar" class="hide">
    <div id="buildInfo"></div>
    <button class="btn sm" id="rotBtn">↻ Girar</button>
    <button class="btn sm r" id="cancelBtn">✕</button>
  </div>
  <div id="hot" class="hide"><div id="bagBtn"></div><div id="hotScroll"></div></div>
  <div id="ctl" class="hide">
    <div id="joy"><div id="knob"></div></div>
    <div class="abtn" id="btnB"><img class="ic" id="icB"><small>B</small></div>
    <div class="abtn" id="btnA"><img class="ic" id="icA"><small>A</small></div>
  </div>
  <div id="dlg" class="hide"><div id="dlgPic"></div><div style="flex:1"><div id="dlgName"></div><div id="dlgText"></div></div><div id="dlgNext">▼</div></div>
  <div id="shade" class="hide"></div>
  <div id="panel" class="hide"><div id="pHead"></div><div id="pTabs"></div><div id="pBody"></div></div>
  <div id="title">
    <div id="logo">Musgo<span>&amp; <em>Engrenagens</em></span></div>
    <div id="sub">Um vale aconchegante para plantar, explorar e automatizar — uma engrenagem de cada vez.</div>
    <button class="btn g hide" id="tCont">▶ Continuar</button>
    <button class="btn" id="tNew">✿ Novo Jogo</button>
    <button class="btn sm" id="tHelp">Como jogar</button>
    <div id="ver">Toque para jogar · melhor no celular em pé (9:16)</div>
  </div>
  <div id="fade"><div id="fadeTxt"></div></div>
</div>
<script>
'use strict';
/* =====================================================================
   MUSGO & ENGRENAGENS — jogo isométrico cozy de fazenda + automação
   Tudo neste arquivo: arte em pixel gerada por código, som sintetizado.
   ===================================================================== */
// ---------- utilidades ----------
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TW=32,TH=16,HZ=12,MW=80,MH=80;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // N,L,S,O
const idx=(x,y)=>y*MW+x;
const inb=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash2(xi,yi,s),hash2(xi+1,yi,s),u),lerp(hash2(xi,yi+1,s),hash2(xi+1,yi+1,s),u),v)}
function fbm(x,y,s){return vnoise(x,y,s)*.6+vnoise(x*2.1,y*2.1,s+7)*.3+vnoise(x*4.3,y*4.3,s+13)*.1}
const rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));

// ---------- dados: terrenos ----------
const T={GRASS:0,DGRASS:1,CGRASS:2,PATH:3,SAND:4,WATER:5,SOIL:6,STONEF:7,GRAVEL:8,ORE_CU:9,ORE_FE:10,ORE_COAL:11,ORE_CRY:12,ORE_ST:13,STAIRS:14,BRIDGE:15,BROKEN:16,ROCKTOP:17};
const ORE={9:'min_cobre',10:'min_ferro',11:'carvao',12:'cristal',13:'pedra'};
const isGrass=t=>t<=2;

// ---------- dados: itens ----------
// n: nome, v: valor de venda, ic: [forma, paleta], fuel: segundos de queima, food: meias-vidas curadas
const ITEMS={
  madeira:{n:'Madeira',v:1,fuel:6,ic:['log',['#c98f5a','#e0ad76','#9a6540','#f1d3a0','#d9b27c']]},
  pedra:{n:'Pedra',v:1,ic:['chunk',['#a9a6b0','#cfcdd6','#7f7c8a','#a9a6b0']]},
  carvao:{n:'Carvão',v:2,fuel:16,ic:['chunk',['#4a4656','#6d687c','#2d2a38','#857f96']]},
  min_cobre:{n:'Minério de Cobre',v:2,ic:['chunk',['#a08a80','#c4b0a4','#77645c','#ff9a4d']]},
  min_ferro:{n:'Minério de Ferro',v:2,ic:['chunk',['#8f8a94','#b5b0bb','#69646f','#7fd0e8']]},
  cristal:{n:'Cristal',v:8,ic:['crystal',['#b48cf2','#e3ccff','#7f5ac4']]},
  fibra:{n:'Fibra',v:1,ic:['fiber',['#8fd66a','#c2f09a','#5fae4a']]},
  gosma:{n:'Gosma',v:5,ic:['gel',['#7fe0a0','#c9ffd9','#4fb878']]},
  peixe:{n:'Peixe',v:10,ic:['fish',['#7fb8e8','#c4e4ff','#4f8ac4']]},
  placa_cobre:{n:'Placa de Cobre',v:5,ic:['ingot',['#f08a4a','#ffc08a','#b8562c']]},
  placa_ferro:{n:'Placa de Ferro',v:5,ic:['ingot',['#b4bcc8','#e6ecf2','#7c8696']]},
  tijolo:{n:'Tijolo',v:3,ic:['brick',['#d9744a','#f09a6c','#a84f34']]},
  tabua:{n:'Tábua',v:1,fuel:4,ic:['plank',['#e0ad76','#f4d09c','#b07a48']]},
  engrenagem:{n:'Engrenagem',v:12,ic:['gear',['#b4bcc8','#e6ecf2','#7c8696']]},
  fio:{n:'Fio de Cobre',v:3,ic:['wire',['#f08a4a','#ffc08a','#b8562c']]},
  circuito:{n:'Circuito',v:24,ic:['circuit',['#4fb878','#4fb878','#4fb878','#ffd86b','#ff8a5a']]},
  liga:{n:'Liga Dourada',v:16,ic:['ingot',['#f2c14e','#fff0a8','#b8862c']]},
  lente:{n:'Lente de Cristal',v:32,ic:['lens',['#9ad8f2','#d8f4ff','#5a9cc4']]},
  mecanismo:{n:'Mecanismo',v:70,ic:['mech',['#f2c14e','#fff0a8','#b8862c','#7c8696','#e6ecf2']]},
  nucleo:{n:'Núcleo de Cristal',v:160,ic:['core',['#e07af2','#ffd9ff','#9a4fc4']]},

function hubNeed(id){const st=STAGES[G.stage];return st?Math.max(0,(st.req[id]||0)-(G.hub[id]||0)):0}
function canAccept(e,id){
  switch(e.k){
    case'esteira':return beltSpace(e,.5);
    case'bau':return sumInv(e.inv)<240;
    case'forno':if(SMELT[id])return!e.inp||(e.inp.id===id&&e.inp.n<10);if(ITEMS[id].fuel)return!e.fuel||(e.fuel.id===id&&e.fuel.n<10);return false;
    case'montadora':case'cozinha':{const r=REC[e.rec];if(!r||!r.in[id])return false;return(e.inv[id]||0)<Math.max(r.in[id]*3,6)}
    case'hub':return hubNeed(id)>0;
    case'bin':return ITEMS[id].v>0;
    case'reator':return id==='cristal'&&e.fuel<10;
    case'divisor':return!e.item;
  }return false}
function accept(e,id){
  switch(e.k){
    case'esteira':beltPush(e,id,.5,-1);break;
    case'bau':e.inv[id]=(e.inv[id]||0)+1;break;
    case'forno':if(SMELT[id]){if(e.inp)e.inp.n++;else e.inp={id,n:1}}else{if(e.fuel)e.fuel.n++;else e.fuel={id,n:1}}break;
    case'montadora':case'cozinha':e.inv[id]=(e.inv[id]||0)+1;break;
    case'hub':hubGive(id,1);break;
    case'bin':sell(id,1,e);break;
    case'reator':e.fuel++;break;
    case'divisor':e.item=id;e.cd=.12;break;
  }}
function outputs(e){
  switch(e.k){
    case'esteira':return e.items.map(i=>i.id);
    case'bau':case'colhedora':case'coletor':return Object.keys(e.inv);
    case'forno':case'montadora':case'cozinha':return e.out?[e.out.id]:[];
    case'broca':return e.buf>0?[ORE[terr[idx(e.x,e.y)]]]:[];
  }return[]}
function takeOut(e,id){
  switch(e.k){
    case'esteira':{let b=-1,bd=9;e.items.forEach((it,i)=>{if(it.id===id&&Math.abs(it.pos-.5)<bd){bd=Math.abs(it.pos-.5);b=i}});if(b>=0)e.items.splice(b,1);break}
    case'bau':case'colhedora':case'coletor':if(--e.inv[id]<=0)delete e.inv[id];break;
    case'forno':case'montadora':case'cozinha':if(--e.out.n<=0)e.out=null;break;
    case'broca':e.buf--;break;
  }}
function sell(id,n,e){const v=ITEMS[id].v*n;addCoins(v);G.stats.sold+=v;if(e){e.acc=(e.acc||0)+v;if(!e.ft||e.ft<=0){floatText(e.x+.5,e.y+.5,'+'+e.acc,'ui_coin');e.acc=0;e.ft=1.2;sfx('coin')}}}
function eject(e,id){const[dx,dy]=DIRS[e.d],t=entAt(e.x+dx,e.y+dy);if(!t)return false;
  if(t.k==='esteira'){if(((t.d+2)&3)===e.d||!beltSpace(t,0))return false;beltPush(t,id,0,e.d);return true}
  if(canAccept(t,id)){accept(t,id);return true}return false}
function updBelt(e,dt){const its=e.items;for(let i=0;i<its.length;i++){const it=its[i];let np=it.pos+BSPD*dt;const lim=i===0?1:its[i-1].pos-GAP;
    if(i===0&&np>=1){const[dx,dy]=DIRS[e.d],t=entAt(e.x+dx,e.y+dy);let ok=false;
      if(t){if(t.k==='esteira'){if(((t.d+2)&3)!==e.d&&beltSpace(t,0)){beltPush(t,it.id,0,e.d);ok=true}}else if(canAccept(t,it.id)){accept(t,it.id);ok=true}}
      if(ok){its.shift();i--;continue}np=.999}
    it.pos=Math.max(it.pos,Math.min(np,lim))}}
function updGarra(e,dt){const[dx,dy]=DIRS[e.d];
  if(e.st===0){e.t=0;e.cd=(e.cd||0)-dt;if(e.cd>0)return;e.cd=.12;const s=entAt(e.x-dx,e.y-dy),d=entAt(e.x+dx,e.y+dy);if(!s||!d||s===d)return;
    for(const id of outputs(s)){if(e.filter&&e.filter!==id)continue;if(d.k==='hub'||d.k==='bin'||d.k==='bau'||d.k==='esteira'||d.k==='divisor'||d.k==='forno'||d.k==='montadora'||d.k==='cozinha'||d.k==='reator'){if(!canAccept(d,id))continue}else continue;
      takeOut(s,id);e.held=id;e.st=1;break}}
  else if(e.st===1){e.t+=dt/.38;if(e.t>=1){e.t=1;e.st=2}}
  else if(e.st===2){const d=entAt(e.x+dx,e.y+dy);if(d&&canAccept(d,e.held)){accept(d,e.held);e.held=null;e.st=3}}
  else{e.t-=dt/.38;if(e.t<=0){e.t=0;e.st=0;e.cd=0}}}
function updForno(e,dt){e.on=false;const rid=e.inp&&SMELT[e.inp.id];if(!rid){e.prog=0;return}const r=REC[rid],need=r.in[e.inp.id];
  if(e.inp.n<need||(e.out&&(e.out.id!==rid||e.out.n>=20)))return;
  if(e.burn<=0){if(e.fuel&&e.fuel.n>0){e.burn+=ITEMS[e.fuel.id].fuel;if(--e.fuel.n<=0)e.fuel=null}else return}
  e.on=true;e.burn-=dt;e.prog+=dt;if(e.prog>=r.t){e.prog=0;e.inp.n-=need;if(e.inp.n<=0)e.inp=null;if(e.out)e.out.n+=r.out[1];else e.out={id:rid,n:r.out[1]};G.stats.made++;
    if(rid==='placa_cobre'||rid==='placa_ferro')G.flags.smelted=(G.flags.smelted||0)+1}}
function updAsm(e,dt,pf){e.want=false;const r=REC[e.rec];if(!r)return;if(e.out&&(e.out.id!==r.out[0]||e.out.n>=20))return;for(const id in r.in)if((e.inv[id]||0)<r.in[id])return;
  e.want=true;e.prog+=dt*pf;if(e.prog>=r.t){e.prog=0;for(const id in r.in){e.inv[id]-=r.in[id];if(e.inv[id]<=0)delete e.inv[id]}if(e.out)e.out.n+=r.out[1];else e.out={id:r.out[0],n:r.out[1]};G.stats.made++;G.flags.asm=1}}
function ejectInv(e){for(const id in e.inv){if(eject(e,id)){if(--e.inv[id]<=0)delete e.inv[id];break}}}
function updMachine(e,dt,pf){
  switch(e.k){
    case'esteira':if(e.items.length)updBelt(e,dt);break;
    case'garra':updGarra(e,dt);break;
    case'forno':updForno(e,dt);break;
    case'montadora':case'cozinha':updAsm(e,dt,pf);break;
    case'broca':{const id=ORE[terr[idx(e.x,e.y)]];if(!id)break;if(e.buf>0&&eject(e,id))e.buf--;e.want=e.buf<8;if(e.want){e.prog+=dt*pf;if(e.prog>=2.2){e.prog=0;e.buf++;G.flags.drilled=1}}break}
    case'colhedora':{ejectInv(e);e.want=sumInv(e.inv)<12;if(!e.want)break;e.prog+=dt*pf;if(e.prog>=1.2){e.prog=0;
        out:for(let y=e.y-2;y<=e.y+2;y++)for(let x=e.x-2;x<=e.x+2;x++){if(!inb(x,y))continue;const c=crops.get(idx(x,y));if(c&&c.g>=1){const d=CROPS[c.k];e.inv[c.k]=(e.inv[c.k]||0)+ri(d.y[0],d.y[1]);c.g=0;puff(x+.5,y+.5,d.col[0],5);break out}}}break}
    case'coletor':{ejectInv(e);e.tc=(e.tc||0)-dt;if(e.tc<=0){e.tc=4;let n=0;for(let y=e.y-2;y<=e.y+2;y++)for(let x=e.x-2;x<=e.x+2;x++){const o=inb(x,y)&&obj[idx(x,y)];if(o&&o.k==='tree')n++}e.trees=Math.min(n,5)}
      e.want=e.trees>0&&sumInv(e.inv)<12;if(!e.want)break;e.prog+=dt*pf*e.trees/5;if(e.prog>=2.5){e.prog=0;const id=rnd()<.12?'fibra':'madeira';e.inv[id]=(e.inv[id]||0)+1}break}
    case'aspersor':e.prog+=dt;if(e.prog>=1.5){e.prog=0;for(let y=e.y-1;y<=e.y+1;y++)for(let x=e.x-1;x<=e.x+1;x++){const c=inb(x,y)&&crops.get(idx(x,y));if(c)c.wet=Math.max(c.wet,200)}}break;
    case'divisor':if(e.item){e.cd-=dt;if(e.cd>0)break;const opts=[e.d,(e.d+1)&3,(e.d+3)&3];for(let k=0;k<3;k++){const d=opts[(e.rr+k)%3],[dx,dy]=DIRS[d],t=entAt(e.x+dx,e.y+dy);if(!t)continue;let ok=false;
          if(t.k==='esteira'){if(((t.d+2)&3)!==d&&beltSpace(t,0)){beltPush(t,e.item,0,d);ok=true}}else if(t.k!=='divisor'&&canAccept(t,e.item)){accept(t,e.item);ok=true}
          if(ok){e.rr=(e.rr+k+1)%3;e.item=null;break}}}break;
    case'reator':if(e.burn<=0&&e.fuel>0&&PW.dem>PW.base){e.fuel--;e.burn=45}if(e.burn>0)e.burn-=dt;break;
    case'bin':if(e.ft>0)e.ft-=dt;break;
  }}
// ---------- energia ----------
const PW={sup:0,dem:0,base:0,ratio:1,any:false};
function recalcPower(){pwGrid.fill(0);PW.any=false;for(const e of ents){const b=BLD[e.k];if(!b||!b.gen)continue;PW.any=true;
    if(e.k==='roda')e.ok=DIRS.some(([a,c])=>inb(e.x+a,e.y+c)&&terr[idx(e.x+a,e.y+c)]===T.WATER);
    for(let y=e.y-b.r;y<=e.y+b.r;y++)for(let x=e.x-b.r;x<=e.x+b.r;x++)if(inb(x,y))pwGrid[idx(x,y)]=1}
  for(const e of ents){const b=BLD[e.k];if(b&&b.pw)e.pw=pwGrid[idx(e.x,e.y)]}}
function updPower(){let sup=0,dem=0,base=0;for(const e of ents){const b=BLD[e.k];if(!b)continue;if(b.gen){if(e.k==='roda'){if(e.ok){sup+=b.gen;base+=b.gen}}else if(e.k==='reator'){if(e.burn>0)sup+=b.gen}else{sup+=b.gen;base+=b.gen}}else if(b.pw&&e.pw&&e.want)dem+=b.pw}
  PW.base=base;PW.sup=sup;PW.dem=dem;PW.ratio=dem>0?Math.min(1,sup/dem):1}
let simAcc=0,slowAcc=0;
function simFactory(dt){updPower();const r=PW.ratio;for(let i=0;i<ents.length;i++){const e=ents[i],b=BLD[e.k];updMachine(e,dt,b&&b.pw?(e.pw?r:0):1)}}
// ---------- relógio / etapas ----------
function hubGive(id,n){G.hub[id]=(G.hub[id]||0)+n;const st=STAGES[G.stage];if(!st)return;for(const k in st.req)if((G.hub[k]||0)<st.req[k])return;advanceStage()}
function advanceStage(){const st=STAGES[G.stage];closePanel();G.stage++;G.hub={};addCoins(st.coins);for(const k in st.gift)give(k,st.gift[k]);dirtyHot=true;
  sfx('fanfare');holdUp('ui_coin');for(let i=0;i<40;i++)spark(40.5+(rnd()-.5)*4,40.5+(rnd()-.5)*4,2+rnd()*4,['#ffd86b','#ffffff','#ff9ab5','#b7ef9c'][i%4]);
  if(G.stage>=STAGES.length){ending();return}
  const lines=[{w:'pip',t:`Etapa concluída: <b>${st.n}</b>! O relógio agradece com ${st.coins} moedas.`},{w:'pip',t:`Você aprendeu a construir: <b>${st.un}</b>. Veja em Mochila → Criar.`},{w:'pip',t:STAGES[G.stage].txt}];
  if(G.stage===1)lines.push({w:'pip',t:'Dica: uma <b>Fornalha</b> (8 pedras) transforma minério em placas. Há cobre, ferro e carvão ao sul daqui.'});
  if(G.stage===3)lines.push({w:'pip',t:'Agora dá para consertar a <b>ponte do leste</b>: toque nela levando 20 tábuas e 10 placas de ferro.'});
  if(G.stage===4)lines.push({w:'pip',t:'A <b>Chave das Ruínas</b> abre o portão no alto da escadaria ao norte. Leve comida... e a espada.'});

function updCrops(dt){const sm=season(),rain=G.weather===1&&sm!==3;crops.forEach(c=>{if(rain)c.wet=Math.max(c.wet,60);if(c.wet>0){c.wet-=dt;if(c.g<1){const d=CROPS[c.k];c.g=Math.min(1,c.g+dt/d.t*(sm===3?.6:sm===d.fav?1.5:1))}}})}
function updRegrow(dt){for(let k=regrow.length-1;k>=0;k--){const i=regrow[k],o=obj[i];if(!o||(o.k!=='sap'&&o.k!=='bushc')){regrow.splice(k,1);continue}o.t-=dt;if(o.t<=0){const x=i%MW,y=(i/MW)|0;
      if(o.k==='sap'){if(Math.floor(G.p.x)===x&&Math.floor(G.p.y)===y){o.t=5;continue}obj[i]={k:'tree',v:o.v,hp:o.v===3?5:4}}else obj[i]={k:'bush'};regrow.splice(k,1)}}}
function updTime(dt){G.time+=dt*3;G.stats.t+=dt;if(G.time>=1440){G.time-=1440;G.day++}
  if(G.time>=360&&G.mornDay!==G.day){G.mornDay=G.day;morning()}

  if(G.day>1){if(s!==prev)toast('🍃 Chegou '+(s===0?'a ':'o ')+SEASON_N[s]+'!');toast((G.weather?(s===3?'❄ Dia de neve':'☔ Dia de chuva — as plantas agradecem'):'☀ Bom dia!')+' · Dia '+G.day);saveGame()}}
function ambient(){const h=G.time/60;const day=[1,1,1],night=[.42,.48,.82],dusk=[1,.74,.62],dawn=[.95,.8,.78];const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
  let c;if(h<4.5)c=night;else if(h<6)c=mixc(night,dawn,(h-4.5)/1.5);else if(h<7.5)c=mixc(dawn,day,(h-6)/1.5);else if(h<17)c=day;else if(h<19)c=mixc(day,dusk,(h-17)/2);else if(h<20.5)c=mixc(dusk,night,(h-19)/1.5);else c=night;
  if(G.weather===1)c=[c[0]*.86,c[1]*.9,c[2]*.96];return c}

function puff(x,y,col,n,zp){for(let i=0;i<(n||6);i++)parts.push({x,y,z:zp||6,vx:(rnd()-.5)*2.2,vy:(rnd()-.5)*2.2,vz:20+rnd()*40,g:130,life:.35+rnd()*.35,col,sz:rnd()<.4?2:1})}
function spark(x,y,zp,col){parts.push({x,y,z:zp*HZ,vx:(rnd()-.5)*.6,vy:(rnd()-.5)*.6,vz:10+rnd()*18,g:-4,life:.7+rnd()*.8,col,sz:1})}
function smoke(x,y,zp){parts.push({x,y,z:zp,vx:.15+rnd()*.2,vy:-.15-rnd()*.2,vz:9+rnd()*5,g:0,life:1.1+rnd()*.6,col:rnd()<.5?'#e8e4f0':'#c9c4d8',sz:2})}
function floatText(x,y,txt,icon){floats.push({x,y,t:0,txt:String(txt),icon})}
function drop(id,x,y,n){for(let i=0;i<(n||1);i++){const a=rnd()*6.28,s=.8+rnd()*1.4;drops.push({id,x,y,z:8,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:60+rnd()*30,t:0})}}
function updFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=p.g*dt;if(p.z<0){p.z=0;p.vz*=-.3}}
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>1.1)floats.splice(i,1)}
  const pl=G.p;
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.t+=dt;if(d.ox===undefined){d.ox=d.x;d.oy=d.y}
    if(d.z>0||d.vz>0){d.x+=d.vx*dt;d.y+=d.vy*dt;d.z+=d.vz*dt;d.vz-=260*dt;if(d.z<=0){d.z=0;d.vz=d.vz<-40?-d.vz*.35:0;d.vx*=.4;d.vy*=.4;
        if(solidAt(Math.floor(d.x),Math.floor(d.y))&&!solidAt(Math.floor(d.ox),Math.floor(d.oy))){d.x=d.ox;d.y=d.oy;d.vx=d.vy=0}}}
    const dx=pl.x-d.x,dy=pl.y-d.y,dd=Math.hypot(dx,dy);
    if(d.t>.4&&(dd<2.2||(d.key&&d.t>1))&&!G.demo){const s=Math.min(dd,dt*(5+(2.2-dd)*5));d.x+=dx/(dd||1)*s;d.y+=dy/(dd||1)*s;
      if(dd<.4){drops.splice(i,1);
        if(d.id==='heart'){heal(2)}else if(d.id==='coin'){addCoins(d.n||1);floatText(pl.x,pl.y,'+'+(d.n||1),'ui_coin')}
        else if(d.id==='heartc'){pl.maxhp+=2;pl.hp=pl.maxhp;dirtyHud=true;toast('♥ Um coração a mais!');sfx('fanfare');holdUp('ui_heart')}
        else{give(d.id,1);const f=floats.find(f=>f.icon===d.id&&f.t<.5);if(f){f.txt='+'+(parseInt(f.txt)+1);f.t=0}else floatText(pl.x,pl.y,'+1',d.id)}
        sfx('pick');continue}}
    if(d.t>150)drops.splice(i,1)}
}

const IN={jx:0,jy:0,a:false,b:false,keys:{}};
let uiBusy=false; // painel/diálogo aberto
const busy=()=>uiBusy||G.demo||G.fainted;
function solidAt(x,y){if(!inb(x,y))return true;const i=idx(x,y),t=terr[i];if(t===T.WATER||t===T.BROKEN)return true;const o=obj[i];if(o&&o.k!=='sap'&&o.k!=='bushc'&&!(o.k==='tchest'&&0))return true;const e=ent[i];if(e&&!(BLD[e.k]&&BLD[e.k].flat===1))return true;return false}
function canStep(fx,fy,tx,ty){if(!inb(tx,ty)||!inb(fx,fy))return false;const a=hgt[idx(fx,fy)],b=hgt[idx(tx,ty)];if(a===b)return true;
  if(terr[idx(fx,fy)]===T.STAIRS&&b===a+1&&ty<fy)return true;if(terr[idx(tx,ty)]===T.STAIRS&&a===b+1&&ty>fy)return true;return false}
const PR=.22;
function freeAt(nx,ny,cx,cy){for(const[ox,oy]of[[-PR,-PR],[PR,-PR],[-PR,PR],[PR,PR]]){const tx=Math.floor(nx+ox),ty=Math.floor(ny+oy);if(tx===cx&&ty===cy)continue;if(solidAt(tx,ty)||!canStep(cx,cy,tx,ty))return false}return true}
function groundZ(x,y){const tx=Math.floor(x),ty=Math.floor(y);if(!inb(tx,ty))return 0;const i=idx(tx,ty);if(terr[i]===T.STAIRS)return hgt[i]+clamp(1-(y-ty),0,1);return hgt[i]}
function moveBody(b,dx,dy){const cx=Math.floor(b.x),cy=Math.floor(b.y);let m=false;if(dx&&freeAt(b.x+dx,b.y,cx,cy)){b.x+=dx;m=true}const cx2=Math.floor(b.x);if(dy&&freeAt(b.x,b.y+dy,cx2,cy)){b.y+=dy;m=true}return m}
function findPath(sx,sy,tx,ty,adj){if(!inb(tx,ty))return null;const par=new Int32Array(MW*MH).fill(-1),q=[idx(sx,sy)];par[q[0]]=q[0];let goal=-1;
  for(let h=0;h<q.length&&h<5000;h++){const c=q[h],x=c%MW,y=(c/MW)|0;
    if(adj?(Math.abs(x-tx)+Math.abs(y-ty)===1&&Math.abs(hgt[c]-hgt[idx(tx,ty)])<=(terr[c]===T.STAIRS?1:0)):(x===tx&&y===ty)){goal=c;break}
    for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const n=idx(nx,ny);if(par[n]>=0||solidAt(nx,ny)||!canStep(x,y,nx,ny))continue;par[n]=c;q.push(n)}}
  if(goal<0)return null;const out=[];for(let c=goal;par[c]!==c;c=par[c])out.push([c%MW,(c/MW)|0]);return out.reverse()}
function heal(n){const p=G.p;p.hp=Math.min(p.maxhp,p.hp+n);dirtyHud=true;for(let i=0;i<5;i++)spark(p.x+(rnd()-.5)*.6,p.y+(rnd()-.5)*.6,p.z+1,'#ff8fa8')}

function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,last?(ts-last)/1000:0);last=ts;if(!G||document.hidden)return;
  update(dt);render(dt);dlgTick(dt);musicTick();
  if(!G.demo){uiT-=dt;if(uiT<=0){uiT=.2;updHud();if(PN&&PN.live&&!uiTouch){pnT++;if(pnT%2===0)renderPanel(false)}}if(dirtyHot&&!uiTouch)updHot()}}
function showUI(on){for(const s of['#hud','#quest','#hot','#ctl'])$(s).classList.toggle('hide',!on);$('#title').classList.toggle('hide',on);if(!on){$('#buildBar').classList.add('hide');$('#boss').classList.add('hide')}}
function startGame(cont){audioInit();fade(true);setTimeout(()=>{
  let fresh=true;if(cont&&loadGame())fresh=false;else{G=newState();genWorld()}
  G.demo=false;G.fainted=false;G.sel=null;G.mode=null;mobs=[];const p=G.p;p.act=null;p.pose=null;p.fish=null;p.auto=null;cam.x=(p.x-p.y)*16;cam.y=(p.x+p.y)*8;dirtyHot=dirtyHud=true;lastObj='';lastA='';showUI(true);updHud();updHot();fade(false);
  if(fresh){G.pipNew=true;setTimeout(()=>say([{w:'pip',t:'Ah, finalmente alguém acordado! Eu sou o <b>Pip</b>, o espírito do Grande Relógio.'},{w:'pip',t:'Era ele que fazia as estações girarem aqui no Vale do Musgo. Mas parou… e eu sozinho não consigo dar corda.'},
    {w:'pip',t:'Você leva jeito com ferramentas, né? Traga materiais, construa máquinas e vamos consertá-lo, etapa por etapa.'},
    {w:'pip',t:'Use o <b>direcional</b> para andar, <b>A</b> para agir e <b>B</b> para a espada. Também dá para tocar no chão ou nas coisas para ir até lá.'},{w:'pip',t:'Para começar: corte árvores e quebre pedras. Preciso de <b>10 madeiras</b> e <b>10 pedras</b>!'}]),500)}
  else toast('Bem-vindo de volta ao vale! ✿')},650)}
function toTitle(){fade(true);setTimeout(()=>{G=newState();G.demo=true;G.stage=4;G.time=9*60;genWorld();showUI(false);$('#tCont').classList.toggle('hide',!hasSave());closePanel();fade(false)},650)}
function boot(){cv=$('#cv');lightC=document.createElement('canvas');lightG=lightC.getContext('2d');genArt();
  for(const k of['bin','banca','casa'])iconFromSprite('ui_'+k,SPB[k].f[0]);
  for(const k of['nono','bento']){const[c,g]=mk(18,18);g.drawImage(charFrame(k,'idle',0,0,0).c,-(HA.x-9),-(HA.y-31));PORT[k]=c.toDataURL()}PORT.pip=CH.pip[0].toDataURL();
  $('#coinIc').src=IURL.ui_coin;$('#icA').src=IURL.ui_hand;$('#icB').src=IURL.ui_sword;$('#bagBtn').innerHTML=ic('ui_bag',34);
  G=newState();G.demo=true;G.stage=4;G.time=9*60;genWorld();resize();cam.x=0;cam.y=(40.5+40.5)*8;wireInput();
  $('#tCont').classList.toggle('hide',!hasSave());
  $('#tCont').addEventListener('click',()=>startGame(true));
  let sure=false;$('#tNew').addEventListener('click',()=>{if(hasSave()&&!sure){sure=true;$('#tNew').textContent='Apagar o jogo salvo e recomeçar?';setTimeout(()=>{sure=false;$('#tNew').textContent='✿ Novo Jogo'},3500);return}startGame(false)});
  $('#tHelp').addEventListener('click',()=>openPanel({title:'Como jogar',icon:'ui_pip',render:()=>GUIDE+'<div class="info">Objetivo: entregar materiais ao <b>Grande Relógio</b> em 6 etapas. Cada etapa libera novas máquinas — das primeiras tábuas até o Núcleo de Cristal.</div>',on(){}}));
  requestAnimationFrame(frame)}
addEventListener('load',boot);

</script>
</body>
